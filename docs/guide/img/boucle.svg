<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="Helvetica, Arial, sans-serif"><rect width="1200" height="460" rx="12" fill="#ffffff"/><text x="600.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Une boucle loop(), vue au microscope (toutes les ~20 ms une image LED)</text><text x="60.0" y="78.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">Boucle typique avec une image LED à envoyer :</text><rect x="60.0" y="90.0" width="48.0" height="46.0" rx="4" fill="#e6f0ff" stroke="#7d8790" stroke-width="1.2"/><text x="84.0" y="111.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222222">lecture</text><rect x="108.0" y="90.0" width="24.0" height="46.0" rx="4" fill="#fff3d6" stroke="#7d8790" stroke-width="1.2"/><text x="120.0" y="111.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222222">jeu</text><rect x="132.0" y="90.0" width="72.0" height="46.0" rx="4" fill="#fde2c8" stroke="#7d8790" stroke-width="1.2"/><text x="168.0" y="111.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222222">effet LED</text><text x="168.0" y="127.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">calcul 300 px</text><rect x="204.0" y="90.0" width="432.0" height="46.0" rx="4" fill="#d7f0dc" stroke="#7d8790" stroke-width="1.2"/><text x="420.0" y="111.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222222">FastLED.show()</text><text x="420.0" y="127.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">9 ms, interruptions coupées</text><text x="650.4" y="118.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">→ recommence</text><text x="60.0" y="168.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">Boucle où le jeu envoie aussi une commande au lecteur MP3 :</text><rect x="60.0" y="180.0" width="48.0" height="46.0" rx="4" fill="#e6f0ff" stroke="#7d8790" stroke-width="1.2"/><text x="84.0" y="201.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222222">lecture</text><rect x="108.0" y="180.0" width="499.2" height="46.0" rx="4" fill="#f3e6ff" stroke="#7d8790" stroke-width="1.2"/><text x="357.6" y="201.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222222">trame MP3 : 10 octets à 9600 bauds</text><text x="357.6" y="217.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">≈ 10,4 ms</text><rect x="607.2" y="180.0" width="72.0" height="46.0" rx="4" fill="#fde2c8" stroke="#7d8790" stroke-width="1.2"/><text x="643.2" y="201.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222222">effet LED</text><rect x="679.2" y="180.0" width="432.0" height="46.0" rx="4" fill="#d7f0dc" stroke="#7d8790" stroke-width="1.2"/><text x="895.2" y="201.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222222">FastLED.show()</text><text x="895.2" y="217.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">9 ms</text><line x1="60.0" y1="290.0" x2="60.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="60.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">0 ms</text><line x1="156.0" y1="290.0" x2="156.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="156.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">2 ms</text><line x1="252.0" y1="290.0" x2="252.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="252.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">4 ms</text><line x1="348.0" y1="290.0" x2="348.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="348.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">6 ms</text><line x1="444.0" y1="290.0" x2="444.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="444.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">8 ms</text><line x1="540.0" y1="290.0" x2="540.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="540.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">10 ms</text><line x1="636.0" y1="290.0" x2="636.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="636.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">12 ms</text><line x1="732.0" y1="290.0" x2="732.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="732.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">14 ms</text><line x1="828.0" y1="290.0" x2="828.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="828.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">16 ms</text><line x1="924.0" y1="290.0" x2="924.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="924.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">18 ms</text><line x1="1020.0" y1="290.0" x2="1020.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="1020.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">20 ms</text><line x1="1116.0" y1="290.0" x2="1116.0" y2="296.0" stroke="#888" stroke-width="1"/><text x="1116.0" y="310.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">22 ms</text><line x1="60.0" y1="290.0" x2="1116.0" y2="290.0" stroke="#888" stroke-width="1"/><rect x="60.0" y="330.0" width="1080.0" height="81.2" rx="8" fill="#f7f7f7" stroke="#d5d5d5" stroke-width="1.2"/><text x="72.0" y="351.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">Pourquoi c'est important</text><text x="72.0" y="367.8" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">Règle d'or : rien ne bloque. Pas de delay(), pas d'attente active. Chaque module regarde l'heure (millis()) et décide</text><text x="72.0" y="384.6" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">s'il a quelque chose à faire maintenant. Au pire, une boucle dure ~22 ms : le bouton (anti-rebond 30 ms), la vitesse</text><text x="72.0" y="401.4" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">et le son restent réactifs. Les tests vérifient qu'une boucle lente donne exactement la même partie qu'une boucle rapide.</text></svg>
