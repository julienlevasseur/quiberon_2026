<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="Helvetica, Arial, sans-serif"><rect width="1180" height="520" rx="12" fill="#ffffff"/><text x="590.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Ce que l'Arduino envoie au lecteur MP3 pendant une partie</text><rect x="200.0" y="55.0" width="140.0" height="36.0" rx="6" fill="#0e7c86" stroke="#08545b" stroke-width="1.5"/><text x="270.0" y="78.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">Arduino (Audio)</text><rect x="990.0" y="55.0" width="140.0" height="36.0" rx="6" fill="#18324f" stroke="#0c1a2b" stroke-width="1.5"/><text x="1060.0" y="78.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">lecteur MP3</text><line x1="270.0" y1="91.0" x2="270.0" y2="500.0" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="1060.0" y1="91.0" x2="1060.0" y2="500.0" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="274.0" y1="125.0" x2="1050.6" y2="125.0" stroke="#2f6fd6" stroke-width="1.8"/><path d="M1056.0,125.0 L1047.7,128.5 L1047.7,121.5 z" fill="#2f6fd6"/><text x="665.0" y="119.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4f91">volume 20</text><text x="258.0" y="129.0" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">démarrage + 2 s</text><line x1="274.0" y1="169.0" x2="1050.6" y2="169.0" stroke="#2f6fd6" stroke-width="1.8"/><path d="M1056.0,169.0 L1047.7,172.5 L1047.7,165.5 z" fill="#2f6fd6"/><text x="665.0" y="163.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4f91">joue 1 (compte à rebours)</text><text x="258.0" y="173.0" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">appui sur départ</text><line x1="1056.0" y1="189.0" x2="279.4" y2="189.0" stroke="#d9822b" stroke-width="1.5"/><path d="M274.0,189.0 L282.3,185.5 L282.3,192.5 z" fill="#d9822b"/><text x="665.0" y="203.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#9a4f0c" font-style="italic">BUSY : lecture… puis repos → début de la course</text><line x1="274.0" y1="231.0" x2="1050.6" y2="231.0" stroke="#2f6fd6" stroke-width="1.8"/><path d="M1056.0,231.0 L1047.7,234.5 L1047.7,227.5 z" fill="#2f6fd6"/><text x="665.0" y="225.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4f91">joue 2 (musique)</text><text x="258.0" y="235.0" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">début de la course</text><line x1="274.0" y1="275.0" x2="1050.6" y2="275.0" stroke="#2f6fd6" stroke-width="1.8"/><path d="M1056.0,275.0 L1047.7,278.5 L1047.7,271.5 z" fill="#2f6fd6"/><text x="665.0" y="269.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4f91">répétition ON</text><text x="258.0" y="279.0" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">BUSY confirme la lecture</text><line x1="1056.0" y1="295.0" x2="279.4" y2="295.0" stroke="#d9822b" stroke-width="1.5"/><path d="M274.0,295.0 L282.3,291.5 L282.3,298.5 z" fill="#d9822b"/><text x="665.0" y="309.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#9a4f0c" font-style="italic">la musique boucle pendant 3 min</text><line x1="274.0" y1="337.0" x2="1050.6" y2="337.0" stroke="#2f6fd6" stroke-width="1.8"/><path d="M1056.0,337.0 L1047.7,340.5 L1047.7,333.5 z" fill="#2f6fd6"/><text x="665.0" y="331.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4f91">répétition OFF</text><text x="258.0" y="341.0" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">fin de la course</text><line x1="274.0" y1="381.0" x2="1050.6" y2="381.0" stroke="#2f6fd6" stroke-width="1.8"/><path d="M1056.0,381.0 L1047.7,384.5 L1047.7,377.5 z" fill="#2f6fd6"/><text x="665.0" y="375.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4f91">joue 3 (applaudissements)</text><line x1="1056.0" y1="401.0" x2="279.4" y2="401.0" stroke="#d9822b" stroke-width="1.5"/><path d="M274.0,401.0 L282.3,397.5 L282.3,404.5 z" fill="#d9822b"/><text x="665.0" y="415.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#9a4f0c" font-style="italic">BUSY : lecture… puis repos</text><line x1="274.0" y1="443.0" x2="1050.6" y2="443.0" stroke="#2f6fd6" stroke-width="1.8"/><path d="M1056.0,443.0 L1047.7,446.5 L1047.7,439.5 z" fill="#2f6fd6"/><text x="665.0" y="437.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4f91">joue 4 (vainqueur)</text><text x="258.0" y="447.0" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">fin des applaudissements (ou 12 s)</text><line x1="274.0" y1="487.0" x2="1050.6" y2="487.0" stroke="#2f6fd6" stroke-width="1.8"/><path d="M1056.0,487.0 L1047.7,490.5 L1047.7,483.5 z" fill="#2f6fd6"/><text x="665.0" y="481.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d4f91">stop</text><text x="258.0" y="491.0" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">fin du final</text><text x="590.0" y="510.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" font-style="italic">Flèches bleues : commandes (fil D5 → RX). Flèches orange : ce que dit la ligne BUSY (→ D3).</text></svg>
