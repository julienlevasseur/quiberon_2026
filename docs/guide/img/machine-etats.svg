<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Helvetica, Arial, sans-serif"><rect width="1100" height="520" rx="12" fill="#ffffff"/><text x="550.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">La machine à états du jeu (classe Game)</text><ellipse cx="190" cy="270" rx="110" ry="48" fill="#e8eef5" stroke="#7d8790" stroke-width="2"/><text x="190.0" y="268.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">REPOS</text><text x="190.0" y="288.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" font-family="ui-monospace, Menlo, Consolas, monospace">PHASE_IDLE</text><ellipse cx="470" cy="130" rx="110" ry="48" fill="#fde2c8" stroke="#7d8790" stroke-width="2"/><text x="470.0" y="128.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">COMPTE À REBOURS</text><text x="470.0" y="148.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" font-family="ui-monospace, Menlo, Consolas, monospace">PHASE_COUNTDOWN</text><ellipse cx="800" cy="270" rx="110" ry="48" fill="#d7f0dc" stroke="#7d8790" stroke-width="2"/><text x="800.0" y="268.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">COURSE</text><text x="800.0" y="288.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" font-family="ui-monospace, Menlo, Consolas, monospace">PHASE_RIDE</text><ellipse cx="470" cy="410" rx="110" ry="48" fill="#efe0f7" stroke="#7d8790" stroke-width="2"/><text x="470.0" y="408.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">FINAL</text><text x="470.0" y="428.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" font-family="ui-monospace, Menlo, Consolas, monospace">PHASE_FINALE</text><line x1="250.0" y1="230.0" x2="375.2" y2="167.4" stroke="#222222" stroke-width="2"/><path d="M380.0,165.0 L374.2,171.8 L371.0,165.6 z" fill="#222222"/><rect x="40.0" y="120.0" width="270.0" height="60.2" rx="8" fill="#f7f7f7" stroke="#d5d5d5" stroke-width="1.2"/><text x="52.0" y="139.8" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">IDLE → COUNTDOWN</text><text x="52.0" y="155.2" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">bouton appuyé (après anti-rebond)</text><text x="52.0" y="170.6" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">→ kcal remises à 0, piste 1</text><line x1="570.0" y1="160.0" x2="725.0" y2="225.9" stroke="#222222" stroke-width="2"/><path d="M730.0,228.0 L721.0,228.0 L723.7,221.5 z" fill="#222222"/><rect x="640.0" y="60.0" width="420.0" height="75.6" rx="8" fill="#f7f7f7" stroke="#d5d5d5" stroke-width="1.2"/><text x="652.0" y="79.8" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">COUNTDOWN → RIDE</text><text x="652.0" y="95.2" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">fin de la piste 1 (BUSY repasse au repos)</text><text x="652.0" y="110.6" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">ou, au plus tard, 10 s (COUNTDOWN_TIMEOUT_MS)</text><text x="652.0" y="126.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">→ comptage des kcal, musique en boucle</text><line x1="730.0" y1="315.0" x2="574.9" y2="382.8" stroke="#222222" stroke-width="2"/><path d="M570.0,385.0 L576.2,378.5 L579.0,384.9 z" fill="#222222"/><rect x="760.0" y="360.0" width="300.0" height="60.2" rx="8" fill="#f7f7f7" stroke="#d5d5d5" stroke-width="1.2"/><text x="772.0" y="379.8" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">RIDE → FINALE</text><text x="772.0" y="395.1" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">3 minutes écoulées (RIDE_MS)</text><text x="772.0" y="410.5" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">→ kcal figées, applaudissements</text><line x1="380.0" y1="380.0" x2="254.8" y2="317.4" stroke="#222222" stroke-width="2"/><path d="M250.0,315.0 L259.0,315.6 L255.8,321.8 z" fill="#222222"/><rect x="40.0" y="380.0" width="270.0" height="60.2" rx="8" fill="#f7f7f7" stroke="#d5d5d5" stroke-width="1.2"/><text x="52.0" y="399.8" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">FINALE → IDLE</text><text x="52.0" y="415.1" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">30 s écoulées (FINALE_MS)</text><text x="52.0" y="430.5" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">→ silence, retour aux comètes</text><text x="550.0" y="498.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555555" font-style="italic">Un appui sur le bouton pendant une partie est ignoré. La console de banc peut forcer une phase (« phase ride »…).</text></svg>
