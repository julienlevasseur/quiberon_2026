<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" font-family="Helvetica, Arial, sans-serif"><rect width="1180" height="600" rx="12" fill="#ffffff"/><text x="590.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Le ruban WS2815 : comment il est fait et comment il reçoit les couleurs</text><rect x="60.0" y="80.0" width="640.0" height="150.0" rx="6" fill="#1b1b1b" stroke="#000" stroke-width="1.5"/><rect x="140.0" y="125.0" width="60.0" height="60.0" rx="3" fill="#f7f7f2" stroke="#9a9a9a" stroke-width="1.5"/><circle cx="170" cy="155" r="22" fill="#fbe7a1" stroke="#d9c37a"/><rect x="164.0" y="149.0" width="12.0" height="12.0" rx="1" fill="#333" stroke="#333" stroke-width="0"/><text x="170.0" y="210.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#ddd">LED 0</text><rect x="218.0" y="140.0" width="18.0" height="10.0" rx="1" fill="#555" stroke="#777" stroke-width="1"/><rect x="218.0" y="162.0" width="18.0" height="10.0" rx="1" fill="#555" stroke="#777" stroke-width="1"/><line x1="260.0" y1="86.0" x2="260.0" y2="224.0" stroke="#d8b04a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="260.0" y="100.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#d8b04a">✂</text><rect x="340.0" y="125.0" width="60.0" height="60.0" rx="3" fill="#f7f7f2" stroke="#9a9a9a" stroke-width="1.5"/><circle cx="370" cy="155" r="22" fill="#fbe7a1" stroke="#d9c37a"/><rect x="364.0" y="149.0" width="12.0" height="12.0" rx="1" fill="#333" stroke="#333" stroke-width="0"/><text x="370.0" y="210.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#ddd">LED 1</text><rect x="418.0" y="140.0" width="18.0" height="10.0" rx="1" fill="#555" stroke="#777" stroke-width="1"/><rect x="418.0" y="162.0" width="18.0" height="10.0" rx="1" fill="#555" stroke="#777" stroke-width="1"/><line x1="460.0" y1="86.0" x2="460.0" y2="224.0" stroke="#d8b04a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="460.0" y="100.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#d8b04a">✂</text><rect x="540.0" y="125.0" width="60.0" height="60.0" rx="3" fill="#f7f7f2" stroke="#9a9a9a" stroke-width="1.5"/><circle cx="570" cy="155" r="22" fill="#fbe7a1" stroke="#d9c37a"/><rect x="564.0" y="149.0" width="12.0" height="12.0" rx="1" fill="#333" stroke="#333" stroke-width="0"/><text x="570.0" y="210.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#ddd">LED 2</text><rect x="618.0" y="140.0" width="18.0" height="10.0" rx="1" fill="#555" stroke="#777" stroke-width="1"/><rect x="618.0" y="162.0" width="18.0" height="10.0" rx="1" fill="#555" stroke="#777" stroke-width="1"/><rect x="68.0" y="94.0" width="30.0" height="16.0" rx="2" fill="#c49a3b" stroke="#7a5f16" stroke-width="1"/><text x="106.0" y="106.0" font-size="11" text-anchor="start" font-weight="bold" fill="#d62828">12V</text><rect x="68.0" y="130.0" width="30.0" height="16.0" rx="2" fill="#c49a3b" stroke="#7a5f16" stroke-width="1"/><text x="106.0" y="142.0" font-size="11" text-anchor="start" font-weight="bold" fill="#2a9d3a">DI</text><rect x="68.0" y="166.0" width="30.0" height="16.0" rx="2" fill="#c49a3b" stroke="#7a5f16" stroke-width="1"/><text x="106.0" y="178.0" font-size="11" text-anchor="start" font-weight="bold" fill="#2f6fd6">BI</text><rect x="68.0" y="202.0" width="30.0" height="16.0" rx="2" fill="#c49a3b" stroke="#7a5f16" stroke-width="1"/><text x="106.0" y="214.0" font-size="11" text-anchor="start" font-weight="bold" fill="#f2f2f2">GND</text><line x1="420.0" y1="240.0" x2="574.6" y2="240.0" stroke="#2a9d3a" stroke-width="2.5"/><path d="M580.0,240.0 L571.7,243.5 L571.7,236.5 z" fill="#2a9d3a"/><text x="500.0" y="262.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#2a9d3a">sens des données (flèches imprimées)</text><rect x="740.0" y="70.0" width="410.0" height="165.2" rx="8" fill="#f7f7f7" stroke="#d5d5d5" stroke-width="1.2"/><text x="752.0" y="91.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">Les 4 connexions</text><text x="752.0" y="107.8" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">• 12 V : chaque LED consomme ~15 mA en</text><text x="752.0" y="124.6" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">  blanc maximal (3 couleurs en série).</text><text x="752.0" y="141.4" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">• DI : entrée des données. Chaque LED garde</text><text x="752.0" y="158.2" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">  ses 24 bits et passe la suite à la suivante.</text><text x="752.0" y="175.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">• BI : entrée de secours. Si une LED meurt,</text><text x="752.0" y="191.8" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">  la suivante lit BI et la guirlande continue.</text><text x="752.0" y="208.6" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">  Sur la 1re LED, BI est relié au GND.</text><text x="752.0" y="225.4" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">• On peut couper entre deux LED (traits ✂).</text><text x="60.0" y="330.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">Un bit = 1,25 µs. Le niveau haut court = 0, le niveau haut long = 1 :</text><polyline points="80.0,420.0 80.0,360.0 113.6,360.0 113.6,420.0 220.0,420.0 220.0,420.0 220.0,360.0 304.0,360.0 304.0,420.0 360.0,420.0 360.0,420.0 360.0,360.0 444.0,360.0 444.0,420.0 500.0,420.0 500.0,420.0 500.0,360.0 533.6,360.0 533.6,420.0 640.0,420.0" fill="none" stroke="#2a9d3a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="150.0" y="445.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">« 0 »</text><text x="290.0" y="445.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">« 1 »</text><text x="430.0" y="445.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">« 1 »</text><text x="570.0" y="445.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">« 0 »</text><text x="96.8" y="352.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">≈0,3 µs</text><text x="262.0" y="352.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">≈0,75 µs</text><line x1="640.0" y1="420.0" x2="730.0" y2="420.0" stroke="#2a9d3a" stroke-width="2.5"/><text x="685.0" y="410.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#222222">&gt; 280 µs</text><text x="685.0" y="445.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">= fin d'image</text><text x="60.0" y="490.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">Pour chaque LED : 24 bits, vert puis rouge puis bleu (ordre « GRB »).</text><rect x="80.0" y="505.0" width="165.0" height="34.0" rx="4" fill="#2a9d3a" stroke="#2a9d3a" stroke-width="0"/><text x="162.0" y="527.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">G7…G0</text><rect x="250.0" y="505.0" width="165.0" height="34.0" rx="4" fill="#d62828" stroke="#d62828" stroke-width="0"/><text x="332.0" y="527.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">R7…R0</text><rect x="420.0" y="505.0" width="165.0" height="34.0" rx="4" fill="#2f6fd6" stroke="#2f6fd6" stroke-width="0"/><text x="502.0" y="527.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">B7…B0</text><text x="600.0" y="527.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">× 300 LED = 7200 bits ≈ 9 ms par image</text><text x="600.0" y="547.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555555" font-style="italic">pendant ces 9 ms l'Arduino ne fait rien d'autre</text></svg>
