t-size="22" text-anchor="middle" font-weight="bold" fill="#222222" font-family="ui-monospace, Menlo, Consolas, monospace">00</text><text x="520.0" y="146.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">pas d'accusé</text><rect x="575.0" y="70.0" width="90.0" height="56.0" rx="6" fill="#a5d6a7" stroke="#666" stroke-width="1.2"/><text x="620.0" y="106.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#222222" font-family="ui-monospace, Menlo, Consolas, monospace">00</text><text x="620.0" y="146.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">param. haut</text><rect x="675.0" y="70.0" width="90.0" height="56.0" rx="6" fill="#a5d6a7" stroke="#666" stroke-width="1.2"/><text x="720.0" y="106.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#222222" font-family="ui-monospace, Menlo, Consolas, monospace">02</text><text x="720.0" y="146.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">param. bas</text><rect x="775.0" y="70.0" width="90.0" height="56.0" rx="6" fill="#90caf9" stroke="#666" stroke-width="1.2"/><text x="820.0" y="106.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#222222" font-family="ui-monospace, Menlo, Consolas, monospace">FE</text><text x="820.0" y="146.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">somme haut</text><rect x="875.0" y="70.0" width="90.0" height="56.0" rx="6" fill="#90caf9" stroke="#666" stroke-width="1.2"/><text x="920.0" y="106.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#222222" font-family="ui-monospace, Menlo, Consolas, monospace">E7</text><text x="920.0" y="146.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">somme bas</text><rect x="975.0" y="70.0" width="90.0" height="56.0" rx="6" fill="#e0e0e0" stroke="#666" stroke-width="1.2"/><text x="1020.0" y="106.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#222222" font-family="ui-monospace, Menlo, Consolas, monospace">EF</text><text x="1020.0" y="146.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">fin</text><text x="75.0" y="185.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">0x12 = « joue le fichier /mp3/NNNN », NNNN = paramètre (ici 0002).</text><text x="75.0" y="201.2" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">Somme de contrôle = 0 − (FF + 06 + 12 + 00 + 00 + 02) = 0 − 0x119 = 0xFEE7 (sur 16 bits).</text><text x="75.0" y="217.4" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">Autres commandes utilisées : 0x06 volume, 0x16 stop, 0x19 répétition de la piste en cours.</text><text x="75.0" y="288.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">Comment part un octet sur le fil (0x7E, 9600 bauds, 104 µs par bit, bit de poids faible d'abord) :</text><polyline points="55.0,320.0 75.0,320.0 75.0,370.0 165.0,370.0 165.0,370.0 165.0,370.0 255.0,370.0 255.0,370.0 255.0,320.0 345.0,320.0 345.0,320.0 345.0,320.0 435.0,320.0 435.0,320.0 435.0,320.0 525.0,320.0 525.0,320.0 525.0,320.0 615.0,320.0 615.0,320.0 615.0,320.0 705.0,320.0 705.0,320.0 705.0,320.0 795.0,320.0 795.0,320.0 795.0,370.0 885.0,370.0 885.0,370.0 885.0,320.0 975.0,320.0 1005.0,320.0" fill="none" stroke="#2f6fd6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="120.0" y="400.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#222222">start</text><text x="120.0" y="416.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">0</text><line x1="75.0" y1="310.0" x2="75.0" y2="380.0" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/><text x="210.0" y="400.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#222222">b0</text><text x="210.0" y="416.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">0</text><line x1="165.0" y1="310.0" x2="165.0" y2="380.0" stroke="#ddd" 