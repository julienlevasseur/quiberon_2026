h="4.0" height="10.0" rx="0" fill="#c0c0c0" stroke="#c0c0c0" stroke-width="0"/><rect x="482.0" y="217.0" width="4.0" height="10.0" rx="0" fill="#c0c0c0" stroke="#c0c0c0" stroke-width="0"/><text x="480.0" y="176.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#222222">F2</text><rect x="378.0" y="283.0" width="24.0" height="34.0" rx="3" fill="#e7b04a" stroke="#9b6d16" stroke-width="1.5"/><rect x="384.0" y="317.0" width="4.0" height="10.0" rx="0" fill="#c0c0c0" stroke="#c0c0c0" stroke-width="0"/><rect x="392.0" y="317.0" width="4.0" height="10.0" rx="0" fill="#c0c0c0" stroke="#c0c0c0" stroke-width="0"/><text x="390.0" y="276.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#222222">F3</text><rect x="468.0" y="283.0" width="24.0" height="34.0" rx="3" fill="#e7b04a" stroke="#9b6d16" stroke-width="1.5"/><rect x="474.0" y="317.0" width="4.0" height="10.0" rx="0" fill="#c0c0c0" stroke="#c0c0c0" stroke-width="0"/><rect x="482.0" y="317.0" width="4.0" height="10.0" rx="0" fill="#c0c0c0" stroke="#c0c0c0" stroke-width="0"/><text x="480.0" y="276.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#222222">F4</text><polyline points="101.0,186.0 101.0,170.0 330.0,170.0 330.0,250.0 340.0,250.0" fill="none" stroke="#7a1010" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="101.0,186.0 101.0,170.0 330.0,170.0 330.0,250.0 340.0,250.0" fill="none" stroke="#d62828" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="229.0,186.0 229.0,160.0 300.0,160.0 300.0,400.0 340.0,400.0" fill="none" stroke="#000000" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="229.0,186.0 229.0,160.0 300.0,160.0 300.0,400.0 340.0,400.0" fill="none" stroke="#2a2a2a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="350.0" y="385.0" width="170.0" height="20.0" rx="2" fill="#3a3a3a" stroke="#000" stroke-width="1"/><text x="435.0" y="399.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#fff">GND commun</text><polyline points="530.0,200.0 620.0,200.0" fill="none" stroke="#7a1010" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="530.0,200.0 620.0,200.0" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="630.0" y="198.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">F1 → guirlande 1</text><text x="630.0" y="214.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">jusqu'à 4,5 A (blanc max), souvent &lt; 1 A</text><polyline points="530.0,240.0 620.0,240.0" fill="none" stroke="#7a1010" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="530.0,240.0 620.0,240.0" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="630.0" y="238.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">F2 → guirlande 2</text><text x="630.0" y="254.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">idem</text><polyline points="530.0,300.0 620.0,300.0" fill="none" stroke="#7a1010" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="530.0,300.0 620.0,300.0" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="630.0" y="298.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">F3 → ampli audio</text><text x="630.0" y="314.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">selon l'ampli (voir sa notice)</text><polyline points="530.0,340.0 620.0,340.0" fill="none" stroke="#7a1010" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="530.0,340.0 620.0,340.0" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="630.0" y="338.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">F4 → Arduino (jack ou VIN)</text><text x="630.0" y="354.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">≈ 0,1 A, Arduino + lecteur MP3</text><rect x="60.0" y="440.0" width="1060.0" height="64.4" rx="8" fill="#f7f7f7" stroke="#d5d5d5" stroke-width="1.2"/><text x="72.0" y="461.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">Bilan</text><text x="72.0" y="477.8" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">Pire cas des guirlandes : 600 LED × 15 mA = 9 A sous 12 V (≈ 110 W). Le programme plafonne la luminosité (MAX_BRIGHTNESS = 180/255), soit ≈ 6,4 A au maximum.</text><text x="72.0" y="494.6" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">En jeu réel, les effets allument une partie des LED à mi-intensité : quelques ampères au plus. Fils : 1,5 mm² pour les guirlandes, fusible au plus près de la batterie.</text><rect x="800.0" y="60.0" width="350.0" height="91.0" rx="8" fill="#f7f7f7" stroke="#d5d5d5" stroke-width="1.2"/><text x="812.0" y="79.8" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">Recharge</text><text x="812.0" y="95.2" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">Dans le schéma de raccordement,</text><text x="812.0" y="110.6" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">la génératrice recharge aussi la</text><text x="812.0" y="126.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">batterie à travers une diode</text><text x="812.0" y="141.4" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">anti-retour (hors programme).</text></svg>
