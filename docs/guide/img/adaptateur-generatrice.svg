<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" font-family="Helvetica, Arial, sans-serif"><rect width="1180" height="600" rx="12" fill="#ffffff"/><text x="590.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Adaptateur de signal de la génératrice (exemple pour 30 V maximum)</text><rect x="40.0" y="70.0" width="620.0" height="330.0" rx="8" fill="#fafbfc" stroke="#d5dbe1" stroke-width="1.2"/><text x="60.0" y="92.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">Schéma</text><circle cx="110" cy="240" r="34" fill="#fff" stroke="#222222" stroke-width="1.8"/><text x="110.0" y="247.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#222222">G</text><text x="152.0" y="235.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222222">génératrice</text><text x="152.0" y="250.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">0 à 30 V</text><polyline points="110.0,206.0 110.0,150.0 220.0,150.0" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="110.0,274.0 110.0,350.0 620.0,350.0" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="100.0" y="144.0" font-size="14" text-anchor="end" font-weight="bold" fill="#222222">+</text><rect x="220.0" y="141.0" width="70.0" height="18.0" rx="1" fill="#fff" stroke="#222222" stroke-width="1.5"/><text x="255.0" y="134.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222">R1 = 56 kΩ</text><line x1="290.0" y1="150.0" x2="620.0" y2="150.0" stroke="#222222" stroke-width="1.5"/><circle cx="360.0" cy="150.0" r="3.2" fill="#222222"/><line x1="360.0" y1="150.0" x2="360.0" y2="210.0" stroke="#222222" stroke-width="1.5"/><rect x="351.0" y="210.0" width="18.0" height="70.0" rx="1" fill="#fff" stroke="#222222" stroke-width="1.5"/><text x="344.0" y="250.0" font-size="12" text-anchor="end" font-weight="bold" fill="#222222">R2 = 10 kΩ</text><line x1="360.0" y1="280.0" x2="360.0" y2="350.0" stroke="#222222" stroke-width="1.5"/><circle cx="360.0" cy="350.0" r="3.2" fill="#222222"/><circle cx="450.0" cy="150.0" r="3.2" fill="#222222"/><line x1="450.0" y1="150.0" x2="450.0" y2="238.0" stroke="#222222" stroke-width="1.5"/><line x1="432.0" y1="238.0" x2="468.0" y2="238.0" stroke="#222222" stroke-width="2.5"/><line x1="432.0" y1="248.0" x2="468.0" y2="248.0" stroke="#222222" stroke-width="2.5"/><line x1="450.0" y1="248.0" x2="450.0" y2="350.0" stroke="#222222" stroke-width="1.5"/><circle cx="450.0" cy="350.0" r="3.2" fill="#222222"/><text x="472.0" y="247.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">C = 100 nF</text><circle cx="570.0" cy="150.0" r="3.2" fill="#222222"/><line x1="570.0" y1="150.0" x2="570.0" y2="230.0" stroke="#222222" stroke-width="1.5"/><path d="M556,256 L584,256 L570,232 z" fill="#fff" stroke="#222222" stroke-width="1.5"/><polyline points="552.0,226.0 556.0,232.0 584.0,232.0 588.0,238.0" fill="none" stroke="#222222" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><line x1="570.0" y1="256.0" x2="570.0" y2="350.0" stroke="#222222" stroke-width="1.5"/><circle cx="570.0" cy="350.0" r="3.2" fill="#222222"/><text x="592.0" y="247.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">Zener 5,1 V</text><text x="592.0" y="262.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555555">(protection)</text><line x1="620.0" y1="150.0" x2="640.0" y2="150.0" stroke="#222222" stroke-width="1.5"/><circle cx="644" cy="150" r="4" fill="#fff" stroke="#222222" stroke-width="1.5"/><text x="654.0" y="155.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">A1</text><circle cx="624" cy="350" r="4" fill="#fff" stroke="#222222" stroke-width="1.5"/><text x="634.0" y="355.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">GND</text><rect x="720.0" y="70.0" width="430.0" height="232.4" rx="8" fill="#f7f7f7" stroke="#d5d5d5" stroke-width="1.2"/><text x="732.0" y="91.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">Comment choisir les valeurs</text><text x="732.0" y="107.8" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">V(A1) = V(génératrice) × R2 / (R1 + R2)</text><text x="732.0" y="124.6" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">      = 30 V × 10 / (56 + 10) = 4,5 V</text><text x="732.0" y="141.4" font-size="12" text-anchor="start" font-weight="normal" fill="#222222"></text><text x="732.0" y="158.2" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">1. Mesurer la tension maximale Vmax de</text><text x="732.0" y="175.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">   la génératrice (sprint le plus fort).</text><text x="732.0" y="191.8" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">2. Choisir R2 = 10 kΩ, puis</text><text x="732.0" y="208.6" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">   R1 ≥ R2 × (Vmax / 4,5 − 1).</text><text x="732.0" y="225.4" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">3. Vérifier au multimètre : A1 &lt; 5 V.</text><text x="732.0" y="242.2" font-size="12" text-anchor="start" font-weight="normal" fill="#222222"></text><text x="732.0" y="259.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">C filtre les parasites du moteur.</text><text x="732.0" y="275.8" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">La Zener écrête au-delà de 5,1 V</text><text x="732.0" y="292.6" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">(génératrice en survitesse, pic).</text><line x1="130.0" y1="550.0" x2="550.0" y2="550.0" stroke="#e6e6e6" stroke-width="1"/><text x="122.0" y="554.0" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">0</text><line x1="130.0" y1="467.5" x2="550.0" y2="467.5" stroke="#e6e6e6" stroke-width="1"/><text x="122.0" y="471.5" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">4,5</text><line x1="130.0" y1="456.5" x2="550.0" y2="456.5" stroke="#e6e6e6" stroke-width="1"/><text x="122.0" y="460.5" font-size="11" text-anchor="end" font-weight="normal" fill="#555555">5,1</text><line x1="130.0" y1="440.0" x2="130.0" y2="550.0" stroke="#eeeeee" stroke-width="1"/><text x="130.0" y="568.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">0</text><line x1="235.0" y1="440.0" x2="235.0" y2="550.0" stroke="#eeeeee" stroke-width="1"/><text x="235.0" y="568.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">10</text><line x1="340.0" y1="440.0" x2="340.0" y2="550.0" stroke="#eeeeee" stroke-width="1"/><text x="340.0" y="568.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">20</text><line x1="445.0" y1="440.0" x2="445.0" y2="550.0" stroke="#eeeeee" stroke-width="1"/><text x="445.0" y="568.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">30</text><line x1="550.0" y1="440.0" x2="550.0" y2="550.0" stroke="#eeeeee" stroke-width="1"/><text x="550.0" y="568.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">40</text><line x1="130.0" y1="550.0" x2="550.0" y2="550.0" stroke="#888" stroke-width="1.5"/><line x1="130.0" y1="440.0" x2="130.0" y2="550.0" stroke="#888" stroke-width="1.5"/><text x="340.0" y="590.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">tension de la génératrice (V)</text><text x="82.0" y="495.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222" transform="rotate(-90 82 495.0)">A1 (V)</text><polyline points="130.0,550.0 445.0,466.7 482.8,456.5 550.0,454.7" fill="none" stroke="#2f6fd6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="130.0,467.5 550.0,467