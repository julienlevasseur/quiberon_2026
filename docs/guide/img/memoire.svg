<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" width="1100" height="350" font-family="Helvetica, Arial, sans-serif"><rect width="1100" height="350" rx="12" fill="#ffffff"/><text x="550.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Où va la mémoire de l'Arduino Uno</text><text x="80.0" y="80.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">RAM : 2048 octets en tout (c'est très peu !)</text><rect x="80.0" y="90.0" width="413.1" height="56.0" rx="0" fill="#ff8a65" stroke="#666" stroke-width="1.2"/><text x="286.5" y="115.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222">couleurs des 300 LED</text><text x="286.5" y="133.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222222">900 o</text><rect x="493.1" y="90.0" width="284.1" height="56.0" rx="0" fill="#90caf9" stroke="#666" stroke-width="1.2"/><text x="635.1" y="115.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222">autres variables</text><text x="635.1" y="133.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222222">619 o</text><rect x="777.2" y="90.0" width="242.8" height="56.0" rx="0" fill="#e0e0e0" stroke="#666" stroke-width="1.2"/><text x="898.6" y="115.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222">libre pour la pile</text><text x="898.6" y="133.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222222">529 o</text><line x1="785.0" y1="84.0" x2="785.0" y2="160.0" stroke="#d62828" stroke-width="2" stroke-dasharray="5 4"/><text x="785.0" y="176.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#d62828">limite imposée par make firmware : 1536 o</text><text x="80.0" y="220.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222222">Flash (programme) : 32 256 octets</text><rect x="80.0" y="230.0" width="486.0" height="40.0" rx="0" fill="#a5d6a7" stroke="#666" stroke-width="1.2"/><rect x="566.0" y="230.0" width="454.0" height="40.0" rx="0" fill="#f1f1f1" stroke="#666" stroke-width="1.2"/><text x="323.0" y="255.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222">programme : 16 678 o (52 %)</text><text x="793.0" y="255.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555555">libre</text><text x="80.0" y="310.0" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">Les textes de la console sont gardés en flash (F("..."), PSTR) et non en RAM ; le port série « émission seule »</text><text x="80.0" y="326.2" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">remplace SoftwareSerial (64 o de tampon économisés) ; les tampons USB sont réduits (Makefile). Mesures du 9/10/2026.</text></svg>
