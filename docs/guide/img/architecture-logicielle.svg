<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif"><rect width="1200" height="760" rx="12" fill="#ffffff"/><text x="600.0" y="30.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">Architecture du programme : la logique au centre, le matériel sur les bords</text><rect x="200.0" y="170.0" width="800.0" height="330.0" rx="14" fill="#eef6ff" stroke="#5b8fd6" stroke-width="2"/><text x="600.0" y="195.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d4f91">src/core/ : la logique du jeu (C++11 pur, aucune dépendance Arduino)</text><rect x="220.0" y="215.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="310.0" y="235.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">App</text><text x="310.0" y="253.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">assemble tout,</text><text x="310.0" y="268.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">1 appel par boucle</text><rect x="410.0" y="215.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="500.0" y="235.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">Game</text><text x="500.0" y="253.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">les 4 phases</text><text x="500.0" y="268.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">et les temps</text><rect x="600.0" y="215.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="690.0" y="235.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">Lights</text><text x="690.0" y="253.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">les effets</text><text x="690.0" y="268.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">lumineux</text><rect x="790.0" y="215.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="880.0" y="235.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">Audio</text><text x="880.0" y="253.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">quelle piste,</text><text x="880.0" y="268.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">quand</text><rect x="220.0" y="310.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="310.0" y="330.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">Button</text><text x="310.0" y="348.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">anti-rebond</text><rect x="410.0" y="310.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="500.0" y="330.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">SpeedSensor</text><text x="500.0" y="348.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">ADC → vitesse</text><text x="500.0" y="363.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">filtrée 0..255</text><rect x="600.0" y="310.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="690.0" y="330.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">Calories</text><text x="690.0" y="348.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">vitesse → W</text><text x="690.0" y="363.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">→ kcal</text><rect x="790.0" y="310.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="880.0" y="330.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">DFPlayer</text><text x="880.0" y="348.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">trames de</text><text x="880.0" y="363.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">10 octets</text><rect x="220.0" y="405.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="310.0" y="425.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">Scoreboard</text><text x="310.0" y="443.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">que montrer</text><text x="310.0" y="458.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">sur l'afficheur</text><rect x="410.0" y="405.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="500.0" y="425.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">Console</text><text x="500.0" y="443.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">commandes</text><text x="500.0" y="458.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">de banc d'essai</text><rect x="600.0" y="405.0" width="180.0" height="80.0" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="690.0" y="425.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">config.h</text><text x="690.0" y="443.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">tous les</text><text x="690.0" y="458.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">réglages</text><rect x="790.0" y="405.0" width="180.0" height="80.0" rx="8" fill="#fff8e1" stroke="#d9a400" stroke-width="1.5"/><text x="880.0" y="425.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222">hal.h</text><text x="880.0" y="443.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">les seules « portes »</text><text x="880.0" y="458.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">vers le matériel :</text><text x="880.0" y="473.0" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#555555">Inputs, Rgb, ByteSink, NumberDisplay</text><rect x="330.0" y="60.0" width="540.0" height="80.0" rx="12" fill="#f3f0ff" stroke="#7c5cd6" stroke-width="2"/><text x="600.0" y="85.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#4b2fa3">quiberon_bike.ino : le sketch Arduino (70 lignes)</text><text x="600.0" y="107.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">setup() : prépare les broches   ·   loop() : lit les entrées → app.step() → FastLED.show()</text><text x="600.0" y="124.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" font-style="italic">ne contient aucune règle du jeu</text><line x1="600.0" y1="140.0" x2="600.0" y2="162.6" stroke="#7c5cd6" stroke-width="2"/><path d="M600.0,168.0 L596.5,159.7 L603.5,159.7 z" fill="#7c5cd6"/><rect x="40.0" y="560.0" width="520.0" height="170.0" rx="12" fill="#eaf7ee" stroke="#3a9d5d" stroke-width="2"/><text x="300.0" y="585.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1e6b3a">Sur l'Arduino : src/hal/ + bibliothèque FastLED</text><text x="60.0" y="612.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">readInputs() : lit millis(), A1 (8 mesures), D2 et D3</text><text x="60.0" y="628.2" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">TxSerial : port série « émission seule » sur D5 (9600 bauds)</text><text x="60.0" y="644.4" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">SerialDisplay : affiche les kcal sur l'USB (en attendant l'afficheur)</text><text x="60.0" y="660.6" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">FastLED : envoie les 900 octets de couleurs sur D6</text><text x="300.0" y="715.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1e6b3a" font-family="ui-monospace, Menlo, monospace">make firmware  →  make upload</text><rect x="640.0" y="560.0" width="520.0" height="170.0" rx="12" fill="#fff3e8" stroke="#d9822b" stroke-width="2"/><text x="900.0" y="585.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#9a4f0c">Sur le PC : test/ (faux matériel)</text><text x="660.0" y="612.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">Rig : un banc simulé (cycliste, bouton, temps qui passe)</text><text x="660.0" y="628.2" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">Mp3Sim : décode les trames, simule la ligne BUSY</text><text x="660.0" y="644.4" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">RecordingDisplay : retient tout ce qui a été affiché</text><text x="660.0" y="660.6" font-size="12" text-anchor="start" font-weight="normal" fill="#222222">102 tests + simulateur visuel (pages HTML)</text><text x="900.0" y="715.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#9a4f0c" font-family="ui-monospace, Menlo, monospace">make test  ·  make sim</text><line x1="400.0" y1="500.0" x2="304.7" y2="555.3" stroke="#3a9d5d" stroke-width="2"/><path d="M300.0,558.0 L305.4,550.8 L308.9,556.9 z" fill="#3a9d5d"/><line x1="800.0" y1="500.0" x2="895.3" y2="555.3" stroke="#d9822b" stroke-width="2"/><path d="M900.0,558.0 L891.1,556.9 L894.6,550.8 z" fill="#d9822b"/><text x="600.0" y="535.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222" font-style="italic">le même code de src/core/ est compilé des deux côtés</text></svg>
